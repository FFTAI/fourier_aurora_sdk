# Required package versions. Artifact checksums belong to the distribution's
# SHA256SUMS file because amd64 and arm64 packages have different contents.
compatibility:
  - aurora_sdk: 1.0.1
    fourierdds_package: fourier_dds
    fourierdds_package_version: 1.2.0-1
    message_package: fourier-dds-msgs
    message_package_version: 0.2.0-1
    package_architectures: [amd64, arm64]
    python: ">=3.10,<3.14"
    native_dependencies_bundled_in_wheel: false
